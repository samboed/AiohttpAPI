networks:
  backend:
  db:

services:
  postgres:
    image: postgres:alpine
    restart: unless-stopped
    networks:
      - db
    env_file:
      - .env 
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2G
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  pg_admin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    networks:
      - db
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy 
  app:
    build: .
    restart: unless-stopped
    command: ["python main.py"]
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5000:5000"
    networks:
      - backend
      - db
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
